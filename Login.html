<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroGames - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-white shadow">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
      <a href="Home.html" class="flex items-center space-x-2">
        <div class="bg-indigo-600 p-2 rounded">
            <span class="text-white font-bold text-xl">RG</span>
        </div>
        <span class="text-xl font-bold text-gray-800 tracking-tight">RetroGames</span>
      </a>
      <a href="Home.html" class="text-indigo-600 hover:text-indigo-800 font-medium transition">
        ← Volver a la tienda
      </a>
    </nav>
  </header>

  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
      
      <div class="text-center mb-10">
        <div class="bg-indigo-600 w-16 h-16 rounded-lg flex items-center justify-center mx-auto mb-4">
            <span class="text-white font-bold text-3xl">RG</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">Iniciar Sesión</h1>
        <p class="text-gray-500 mt-2">Accede a tu cuenta</p>
      </div>

      <form action="#" class="space-y-5">
        
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Correo Electrónico</label>
          <input type="email" placeholder="tucorreo@email.com" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-2">Contraseña</label>
          <input type="password" placeholder="••••••••" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <button type="submit" 
          class="w-full bg-indigo-600 text-white font-bold p-3 rounded-lg hover:bg-indigo-700 shadow-md transition transform active:scale-95">
          ENTRAR
        </button>
      </form>

      <div class="flex items-center my-8">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="px-3 text-gray-400 text-sm italic">¿No tienes cuenta?</span>
        <div class="flex-grow border-t border-gray-200"></div>
      </div>

      <div class="text-center">
        <a href="Registro.html" class="inline-block w-full border-2 border-indigo-600 text-indigo-600 font-bold p-3 rounded-lg hover:bg-indigo-50 transition">
          CREAR UNA CUENTA NUEVA
        </a>
      </div>

    </div>
  </main>

  <footer class="bg-gray-900 text-white text-center p-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex space-x-4 text-sm text-gray-400 font-medium">
            <a href="#" class="hover:text-indigo-400">Ayuda</a>
            <a href="#" class="hover:text-indigo-400">Privacidad</a>
        </div>
    </div>
  </footer>

</body>
</html>
