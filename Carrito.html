<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroWorld - Mi Carrito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700;900&display=swap');

        .retro-title { font-family: 'Press Start 2P', cursive; }
        .body-text { font-family: 'Inter', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wallet-card {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .item-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-200 body-text min-h-screen">

    <nav class="sticky top-0 z-50 glass py-4 px-6 mb-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="Home.html" class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i class="fa-solid fa-gamepad text-2xl text-white"></i>
                </div>
                <span class="retro-title text-sm tracking-tighter text-indigo-400">RETRO<br>WORLD</span>
            </a>

            <ul class="hidden md:flex gap-8 font-bold text-xs uppercase tracking-widest text-slate-400">
                <li><a href="Home.html" class="hover:text-indigo-400 transition">Home</a></li>
                <li><a href="Tienda.html" class="hover:text-indigo-400 transition">Tienda</a></li>
                <li><a href="SubirJuego.html" class="hover:text-indigo-400 transition">Subir Juego</a></li>
            </ul>

            <div class="flex items-center gap-6">
                <div class="relative">
                    <a href="Carrito.html" class="text-indigo-400">
                        <i class="fa-solid fa-cart-shopping text-xl transition scale-110"></i>
                    </a>
                    <span class="absolute -top-2 -right-2 bg-rose-500 text-[10px] px-1.5 rounded-full font-bold text-white">3</span>
                </div>

                <img src="https://ui-avatars.com/api/?name=Jaime&background=4f46e5&color=fff" class="w-9 h-9 rounded-full border-2 border-indigo-500/50 shadow-lg shadow-indigo-500/20" alt="Avatar">
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 pb-20">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black italic uppercase tracking-tighter mb-2">Mi <span class="text-indigo-500">Carrito</span></h1>
            <p class="text-slate-500 text-xs tracking-widest uppercase italic">Revisa tu pedido antes del Checkout</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            
            <div class="lg:col-span-2 space-y-4">
                <div class="glass rounded-3xl overflow-hidden border border-slate-800">
                    <div class="item-row p-6 flex items-center justify-between border-b border-slate-800/50 transition">
                        <div class="flex items-center gap-5">
                            <img src="https://m.media-amazon.com/images/I/81vSOnG65PL._AC_SL1500_.jpg" class="w-16 h-20 object-cover rounded-xl shadow-lg shadow-black/50" alt="Juego">
                            <div>
                                <h3 class="font-bold text-white uppercase italic tracking-tight">Zelda: Ocarina of Time</h3>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black text-white">89.95€</p>
                            <button class="text-rose-500 hover:text-rose-400 text-[10px] font-bold uppercase mt-1 transition">Eliminar</button>
                        </div>
                    </div>

                    <div class="item-row p-6 flex items-center justify-between border-b border-slate-800/50 transition">
                        <div class="flex items-center gap-5">
                            <img src="https://m.media-amazon.com/images/I/9199N0-4ZOL._AC_SL1500_.jpg" class="w-16 h-20 object-cover rounded-xl shadow-lg shadow-black/50" alt="Juego">
                            <div>
                                <h3 class="font-bold text-white uppercase italic tracking-tight">Pokémon Rojo</h3>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black text-white">55.00€</p>
                            <button class="text-rose-500 hover:text-rose-400 text-[10px] font-bold uppercase mt-1 transition">Eliminar</button>
                        </div>
                    </div>

                    <div class="item-row p-6 flex items-center justify-between transition">
                        <div class="flex items-center gap-5">
                            <img src="https://m.media-amazon.com/images/I/81L67Yg4-3L._AC_SL1500_.jpg" class="w-16 h-20 object-cover rounded-xl shadow-lg shadow-black/50" alt="Juego">
                            <div>
                                <h3 class="font-bold text-white uppercase italic tracking-tight">Metal Gear Solid</h3>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-black text-white">65.00€</p>
                            <button class="text-rose-500 hover:text-rose-400 text-[10px] font-bold uppercase mt-1 transition">Eliminar</button>
                        </div>
                    </div>
                </div>

                <a href="Tienda.html" class="inline-block text-slate-500 hover:text-indigo-400 font-bold text-xs uppercase tracking-widest transition">
                    ← Seguir comprando
                </a>
            </div>

            <div class="lg:col-span-1">
                <div class="wallet-card rounded-3xl p-8 border border-indigo-500/20 sticky top-28">
                    <h2 class="text-lg font-black uppercase italic mb-6 border-b border-indigo-500/20 pb-4">Resumen</h2>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Subtotal</span>
                            <span class="font-bold text-white">209.95€</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Envío</span>
                            <span class="text-emerald-400 font-bold uppercase">Instantáneo</span>
                        </div>
                        <div class="border-t border-slate-800 pt-4 flex justify-between items-end">
                            <span class="text-xs font-bold uppercase tracking-widest text-indigo-400">Total a pagar</span>
                            <span class="text-3xl font-black text-white italic tracking-tighter">209.95€</span>
                        </div>
                    </div>

                    <button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-2xl transition-all transform hover:-translate-y-1 shadow-[0_0_20px_rgba(79,70,229,0.3)] flex items-center justify-center gap-3 uppercase italic text-lg mb-4">
                        <i class="fa-solid fa-bag-shopping"></i> Finalizar Pedido
                    </button>

                    <div class="flex items-center gap-2 justify-center text-[10px] text-slate-500 uppercase font-bold tracking-widest">
                        <i class="fa-solid fa-lock text-emerald-500"></i> Pago 100% Seguro
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="py-12 text-center text-slate-700 text-[9px] retro-title">
        RETROGAMES
    </footer>

</body>
</html>
