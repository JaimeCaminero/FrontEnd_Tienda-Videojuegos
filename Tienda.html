<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroWorld - Escaparate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700;900&display=swap');
        .retro-title { font-family: 'Press Start 2P', cursive; }
        .body-text { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-glow:hover {
            box-shadow: 0 0 25px rgba(79, 70, 229, 0.3);
            border-color: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 body-text min-h-screen">

    <nav class="sticky top-0 z-50 glass py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <a href="Home.html" class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i class="fa-solid fa-gamepad text-2xl text-white"></i>
                </div>
                <span class="retro-title text-sm tracking-tighter text-indigo-400">RETRO<br>WORLD</span>
            </a>

            <ul class="hidden md:flex gap-8 font-bold text-xs uppercase tracking-widest text-slate-400">
                <li><a href="Home.html" class="hover:text-indigo-400 transition">Home</a></li>
                <li><a href="Tienda.html" class="text-white border-b-2 border-indigo-500 pb-1">Tienda</a></li>
                <li><a href="SubirJuego.html" class="hover:text-indigo-400 transition">Subir Juego</a></li>
            </ul>

            <div class="flex items-center gap-6">                
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping cursor-pointer hover:text-indigo-400"></i>
                    <span class="absolute -top-2 -right-2 bg-rose-500 text-[10px] px-1.5 rounded-full font-bold">3</span>
                </div>

                <div class="relative group">
                    <button class="flex items-center gap-2 focus:outline-none border-2 border-indigo-500/30 rounded-full transition p-1 bg-indigo-500/10">
                        <img src="https://ui-avatars.com/api/?name=Jaime&background=4f46e5&color=fff" class="w-9 h-9 rounded-full shadow-lg" alt="Avatar">
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                    </button>

                    <div class="absolute right-0 mt-4 w-56 bg-[#0f172a] border border-slate-700 rounded-xl shadow-2xl overflow-hidden hidden group-hover:block">
                        <div class="px-5 py-4 border-b border-slate-700 bg-slate-800/50">
                            <p class="font-bold text-white">Hola, <span class="text-indigo-400">Jaime</span></p>
                        </div>
                        <div class="py-2">
                            <a href="MisJuegos.html" class="block px-5 py-3 text-sm text-slate-300 hover:bg-indigo-600 hover:text-white transition flex items-center gap-3">
                                <i class="fa-solid fa-box-open"></i> Mis Juegos
                            </a>
                            <a href="Wallet.html" class="block px-5 py-3 text-sm text-indigo-400 bg-indigo-500/10 transition flex items-center gap-3">
                                <i class="fa-solid fa-wallet"></i> Mi Wallet
                            </a>
                            <div class="border-t border-slate-700 my-1"></div>
                            <a href="#" class="block px-5 py-3 text-sm text-rose-400 hover:bg-rose-600 hover:text-white transition flex items-center gap-3">
                                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-16 pb-12 text-center">
        <h1 class="text-5xl font-black italic uppercase tracking-tighter mb-4">
            Catálogo <span class="text-indigo-500">Completo</span>
        </h1>
        <p class="text-slate-500 text-[10px] tracking-[0.4em] font-bold uppercase">Descubre todos los juegos disponibles</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10" id = "escaparate">
            
        </div>
    </main>

    <footer class="border-t border-slate-800 py-12 px-6 text-center text-slate-600">
        <p class="text-sm">© 2026 RetroWorld Store.</p>
    </footer>

    <script>
        const SERVERIP = "127.0.0.1" //10.1.192.78

        fetchGames()

        //Como usamos el contenido de este fetch para montar la pantalla con todos los juegos disponibles?
        async function fetchGames() {
            console.log("Haciendo fetch de endpoint de juegos")
            const response = await fetch(
                `http://${SERVERIP}:8080/juegos`
            )
            const data = await response.json();
            console.log(data)

            if (data != null) {
                buildGameCards(data, data.length)
            }
        }

        async function buildGameCards(juegos, cap) {
            const target = document.getElementById("escaparate")

            for (let index = 0; index < cap; index++) {
                game = juegos[index]
                console.log("montando carta de juego ",index+1)
                target.insertAdjacentHTML('beforeend',
                `
                <div class="group cursor-pointer">
                <div class="relative aspect-[3/4] rounded-2xl overflow-hidden mb-4 border border-slate-800 transition group-hover:border-indigo-500/50">
                    <img src="${game.imagen}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="${game.nombre}">
                </div>
                <h3 class="font-bold text-lg group-hover:text-indigo-400 transition italic uppercase">${game.nombre}</h3>
                <p class="text-indigo-400 font-black text-2xl">${game.precio}€</p>
                </div>
                `
                )
            }
        }
    </script>
</body>
</html>
