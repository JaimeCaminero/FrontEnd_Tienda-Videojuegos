<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroWorld - Detalles del Juego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700;900&display=swap');
        .retro-title { font-family: 'Press Start 2P', cursive; }
        .body-text { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 body-text min-h-screen">

    <nav class="sticky top-0 z-50 glass py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <a href="Home.html" class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i class="fa-solid fa-gamepad text-2xl text-white"></i>
                </div>
                <span class="retro-title text-sm tracking-tighter text-indigo-400">RETRO<br>WORLD</span>
            </a>

            <ul class="hidden md:flex gap-8 font-bold text-xs uppercase tracking-widest text-slate-400">
                <li><a href="Home.html" class="hover:text-indigo-400 cursor-pointer transition">Home</a></li>
                <li><a href="Tienda.html" class="hover:text-indigo-400 cursor-pointer transition">Tienda</a></li>
                <li><a href="SubirJuego.html" class="hover:text-indigo-400 cursor-pointer transition">Subir Juego</a></li>
            </ul>

            <div class="flex items-center gap-6">                
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping cursor-pointer hover:text-indigo-400 text-xl transition"></i>
                    <span class="absolute -top-2 -right-2 bg-rose-500 text-[10px] px-1.5 rounded-full font-bold">3</span>
                </div>

                <div class="relative group">
                    <button class="flex items-center gap-2 focus:outline-none border-2 border-transparent group-hover:border-indigo-500/50 rounded-full transition p-1 bg-indigo-500/10">
                        <img src="https://ui-avatars.com/api/?name=Jaime&background=4f46e5&color=fff" class="w-9 h-9 rounded-full shadow-lg" alt="Avatar">
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
                    </button>

                    <div class="absolute right-0 mt-4 w-56 bg-[#0f172a] border border-slate-700 rounded-xl shadow-2xl overflow-hidden hidden group-hover:block transform transition-all duration-200 origin-top-right">
                        <div class="px-5 py-4 border-b border-slate-700 bg-slate-800/50">
                            <p class="font-bold text-white">Hola, <span class="text-indigo-400">Jaime</span></p>
                        </div>
                        <div class="py-2">
                            <a href="MisJuegos.html" class="block px-5 py-3 text-sm text-slate-300 hover:bg-indigo-600 hover:text-white transition flex items-center gap-3">
                                <i class="fa-solid fa-box-open"></i> Mis Juegos
                            </a>
                            <div class="border-t border-slate-700 my-1"></div>
                            <a href="Login.html" class="block px-5 py-3 text-sm text-rose-400 hover:bg-rose-600 hover:text-white transition flex items-center gap-3">
                                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div class="mb-8">
            <a href="Tienda.html" class="text-indigo-400 hover:text-indigo-300 text-sm font-bold flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Tienda
            </a>
        </div>

        <div class="flex flex-col lg:flex-row gap-16">
            <div class="w-full lg:w-1/2">
                <div class="glass p-4 rounded-3xl border border-indigo-500/20 shadow-2xl">
                    <img src="https://m.media-amazon.com/images/I/81vSOnG65PL._AC_SL1500_.jpg" 
                         class="w-full h-[500px] object-contain rounded-2xl" alt="Imagen del juego">
                </div>
            </div>

            <div class="w-full lg:w-1/2 flex flex-col">
                <div class="mb-6">
                    <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] px-3 py-1 rounded-full font-bold uppercase italic">
                        <i class="fa-solid fa-shield-check mr-1"></i> Aceptado en Sistema
                    </span>
                </div>

                <h1 class="text-5xl font-black mb-2 text-white leading-none uppercase italic tracking-tighter">
                    THE LEGEND OF ZELDA: <br>
                    <span class="text-indigo-500 font-black">OCARINA OF TIME</span>
                </h1>

                <div class="glass p-6 rounded-2xl border-l-4 border-l-indigo-500 mb-10 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Precio Final</p>
                        <p class="text-4xl font-black text-white">89.95€</p> 
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 mb-10">
                    <button class="flex-grow bg-white text-slate-900 font-black py-5 rounded-2xl transition-all transform hover:-translate-y-1 shadow-[0_0_20px_rgba(255,255,255,0.2)] flex items-center justify-center gap-3 uppercase italic text-lg">
                        <i class="fa-solid fa-bolt"></i> COMPRAR AHORA
                    </button>
                    
                    <button class="flex-grow bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-2xl transition-all transform hover:-translate-y-1 shadow-[0_0_20px_rgba(79,70,229,0.3)] flex items-center justify-center gap-3 uppercase text-lg">
                        <i class="fa-solid fa-cart-plus"></i> AL CARRITO
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4 border-t border-slate-800 pt-8">
                    <div>
                        <p class="text-[9px] text-indigo-400 font-bold uppercase mb-1">Vendedor</p>
                        <p class="text-sm font-bold">Usuario</p> 
                    </div>
                    <div>
                        <p class="text-[9px] text-indigo-400 font-bold uppercase mb-1">Estado</p>
                        <p class="text-sm font-bold text-emerald-400">DISPONIBLE</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 text-center text-slate-700 text-[9px] retro-title">
        RETROWORLD SECURE TRANSACTION MODULE
    </footer>

</body>
</html>
