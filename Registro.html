<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroGames - Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-white shadow">
    <nav class="max-w-7xl mx-auto flex items-center justify-between p-4">
      <a href="Home.html" class="flex items-center space-x-2">
        <div class="bg-indigo-600 p-2 rounded">
            <span class="text-white font-bold text-xl">RG</span>
        </div>
        <span class="text-xl font-bold text-gray-800 tracking-tight">RetroGames</span>
      </a>
      <a href="Login.html" class="text-indigo-600 hover:text-indigo-800 font-medium transition">
        Ya tengo cuenta
      </a>
    </nav>
  </header>

  <main class="flex-grow flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-lg bg-white shadow-lg rounded-lg p-8">
      
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Únete a la comunidad</h1>
        <p class="text-gray-500 mt-2">Crea tu perfil y empieza tu colección</p>
      </div>

      <form action="#" class="space-y-4">
        
        <div>
          <label class="block text-gray-700 font-semibold mb-1 text-sm">Nombre Completo</label>
          <input type="text" placeholder="Tu nombre y apellidos" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-gray-700 font-semibold mb-1 text-sm">Correo Electrónico</label>
          <input type="email" placeholder="ejemplo@correo.com" 
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-1 text-sm">Contraseña</label>
            <input type="password" placeholder="••••••••" 
              class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
          <div>
            <label class="block text-gray-700 font-semibold mb-1 text-sm">Confirmar</label>
            <input type="password" placeholder="••••••••" 
              class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div class="flex items-center space-x-2 py-2">
          <input type="checkbox" id="terms" class="w-4 h-4 text-indigo-600 border-gray-300 rounded">
          <label for="terms" class="text-sm text-gray-600">Acepto los términos y la política de privacidad</label>
        </div>

        <button type="submit" 
          class="w-full bg-indigo-600 text-white font-bold p-3 rounded-lg hover:bg-indigo-700 shadow-md transition transform active:scale-95 mt-4">
          CREAR MI CUENTA
        </button>
      </form>

      <p class="text-center text-gray-500 text-sm mt-8">
        ¿Ya eres miembro? <a href="Login.html" class="text-indigo-600 font-bold hover:underline">Inicia sesión aquí</a>
      </p>

    </div>
  </main>

  <footer class="bg-gray-900 text-white text-center p-8">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-gray-400">© 2025 RetroGames Store - Registro de usuarios.</p>
        <div class="flex space-x-4 text-sm text-gray-400 font-medium">
            <a href="#" class="hover:text-indigo-400">¿Problemas con el registro?</a>
        </div>
    </div>
  </footer>

</body>
</html>
